<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — {{ params.nom_outil }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.8.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <style>:root{--primary:{{ params.couleur_principale }};--secondary:{{ params.couleur_secondaire }};--primary-light:color-mix(in srgb,{{ params.couleur_principale }} 12%,white);}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}</style>
</head>
<body>
<div style="width:100%;max-width:420px;padding:1.5rem;">
  <div style="text-align:center;margin-bottom:2rem;">
    <div style="width:56px;height:56px;background:var(--primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
      <i class="ti ti-key" style="font-size:24px;color:var(--primary);"></i>
    </div>
    <h2 style="font-size:1.375rem;font-weight:700;margin-bottom:.375rem;">Nouveau mot de passe</h2>
  </div>
  {% if erreur %}
  <div class="alert alert--danger" style="margin-bottom:1.25rem;"><i class="ti ti-alert-circle"></i> {{ erreur }}</div>
  {% else %}
  <div class="card card--lg">
    <form method="post" action="/admin/reset-password">
      <input type="hidden" name="token" value="{{ token }}">
      <div class="form-group">
        <label class="form-label" for="pw1">Nouveau mot de passe</label>
        <input type="password" name="password" class="form-control" placeholder="Minimum 8 caractères" required minlength="8" id="pw1">
      </div>
      <div class="form-group">
        <label class="form-label" for="pw2">Confirmer le mot de passe</label>
        <input type="password" name="password2" class="form-control" placeholder="Répétez le mot de passe" required minlength="8" id="pw2">
      </div>
      <div id="matchError" style="display:none;font-size:var(--fs-xs);color:var(--danger);margin-bottom:.75rem;">Les mots de passe ne correspondent pas</div>
      <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;">
        <i class="ti ti-check"></i> Enregistrer
      </button>
    </form>
  </div>
  {% endif %}
  <div style="text-align:center;margin-top:1.5rem;">
    <a href="/admin/connexion" style="font-size:var(--fs-xs);color:var(--text-2);text-decoration:none;">
      <i class="ti ti-arrow-left" style="font-size:var(--fs-2xs);"></i> Retour à la connexion
    </a>
  </div>
</div>
<script>
document.querySelector('form') && document.querySelector('form').addEventListener('submit', e => {
  if (document.getElementById('pw1').value !== document.getElementById('pw2').value) {
    e.preventDefault(); document.getElementById('matchError').style.display = 'block';
  }
});
</script>
</body>
</html>
